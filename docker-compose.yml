services:
  backend:
    build: ./backend
    restart: always
    env_file:
      - ./backend/.env
    labels:
      - traefik.enable=true
      - traefik.http.routers.backend-celcat.rule=Host(`${BACKEND_DOMAIN}`)
      - traefik.http.services.backend-celcat.loadbalancer.server.port=8000

  backend-rust:
    build: ./backend-rust
    restart: always
    env_file:
      - ./backend/.env
    labels:
      - traefik.enable=true
      - traefik.http.routers.backend-rust-celcat.rule=Host(`rust-${BACKEND_DOMAIN}`)
      - traefik.http.services.backend-rust-celcat.loadbalancer.server.port=8000

  frontend:
    build: ./frontend
    restart: always
    environment:
      - NUXT_PUBLIC_API_BASE_URL=https://${BACKEND_DOMAIN}
      - NUXT_PUBLIC_SITE_URL=https://${FRONTEND_DOMAIN}
    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend-celcat.rule=Host(`${FRONTEND_DOMAIN}`)
      - traefik.http.services.frontend-celcat.loadbalancer.server.port=3000
